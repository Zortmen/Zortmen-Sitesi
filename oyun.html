const zortImg = new Image();
zortImg.src = "https://uploads.onecompiler.io/446ptsdzc/446ptk3qx/zortmen.png"; // kendi foto yolun

let player = {
  x: 180,
  y: 450,
  w: 40,
  h: 40,
  speed: 5
};

let zorts = [];
let score = 0;
let gameOver = false;

function spawnZort() {
  zorts.push({
    x: Math.random() * (canvas.width - 30),
    y: -40,
    w: 30,
    h: 30,
    speed: 3 + Math.random() * 3
  });
}

setInterval(spawnZort, 800);

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function update() {
  if (gameOver) return;

  if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
  if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;

  zorts.forEach(z => z.y += z.speed);

  zorts.forEach(z => {
    if (
      z.x < player.x + player.w &&
      z.x + z.w > player.x &&
      z.y < player.y + player.h &&
      z.y + z.h > player.y
    ) {
      gameOver = true;
    }
  });

  zorts = zorts.filter(z => z.y < canvas.height);
  score++;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player resmi
  ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

  // zort resimleri
  zorts.forEach(z => ctx.drawImage(zortImg, z.x, z.y, z.w, z.h));

  // skor
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Skor: " + score, 10, 25);

  if (gameOver) {
    ctx.fillStyle = "yellow";
    ctx.font = "40px Arial";
    ctx.fillText("ZORT!", 130, 250);
    ctx.font = "20px Arial";
    ctx.fillText("Sayfayı yenile", 135, 290);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
